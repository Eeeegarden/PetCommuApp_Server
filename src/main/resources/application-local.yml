spring:
  h2:
    console:
      enabled: true      # H2 콘솔을 활성화
      path: /h2-console  # H2 콘솔의 경로 설정

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true      # 쿼리 로그를 출력하도록 설정
    format_sql: true    # 쿼리 로그를 보기 좋게 포맷팅

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE   # H2 인메모리 데이터베이스를 사
    username: sa
    password:

  file:
    boardImagePath: /tmp/board-images

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG  # 쿼리 로그를 디버그 레벨로 출력